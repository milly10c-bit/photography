<!DOCTYPE html>
<html lang="en" data-theme="light" style="color-scheme: light;"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Your Name — Photography</title>
<meta id="m-desc" name="description" content="Photographer. Landscapes, streets and the occasional portrait. New shoots land here first.">
<meta name="robots" content="index,follow,max-image-preview:large">
<meta property="og:type" content="website">
<meta id="m-ogt" property="og:title" content="Your Name — Photography">
<meta id="m-ogd" property="og:description" content="Photographer. Landscapes, streets and the occasional portrait. New shoots land here first.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Figtree:wght@400;500;600&amp;display=swap">
<style>
:root{
  --paper:#fffae8; --card:#fffdf4; --ink:#2b2412; --muted:#6e6346; --line:#efe5c2; --blue:#1C4E80; --blue-ink:#fff;
  --serif:"Instrument Serif",Georgia,"Times New Roman",serif; --sans:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--paper:#1d1809;--card:#272010;--ink:#fff5d7;--muted:#b9ad88;--line:#3b321a;--blue:#8DBBEA;--blue-ink:#1d1809;color-scheme:dark}
}
:root[data-theme="dark"]{--paper:#1d1809;--card:#272010;--ink:#fff5d7;--muted:#b9ad88;--line:#3b321a;--blue:#8DBBEA;--blue-ink:#1d1809;color-scheme:dark}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;min-height:100%;background:var(--paper);color:var(--ink);font:400 16px/1.55 var(--sans)}
a{color:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:3px}

.shell{max-width:960px;margin:0 auto;padding:48px 24px 80px}
.side{text-align:center;margin:0 auto 44px}
.mark{font:400 44px/1 var(--serif);margin:0 0 14px;letter-spacing:-.01em}
.bio{margin:0 auto 20px;color:var(--muted);max-width:46ch}
.contact{display:inline-block;padding:9px 16px;border-radius:999px;background:var(--blue);color:var(--blue-ink);text-decoration:none;font-weight:600;font-size:14px}

.feed{display:flex;flex-direction:column;gap:56px;max-width:600px;width:100%;margin:0 auto}
.post{background:var(--card);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.post.flash{outline:2px solid var(--blue)}
.head{padding:18px 20px 14px}
.head h2{font:400 30px/1.1 var(--serif);margin:0 0 4px}
.sub{margin:0;color:var(--muted);font-size:14px}
.reel{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;background:var(--line)}
.reel::-webkit-scrollbar{display:none}
.frame{flex:0 0 100%;scroll-snap-align:center;border:0;padding:0;margin:0;cursor:zoom-in;display:block;position:relative;background-size:cover;background-position:center}
.frame img{width:100%;height:100%;object-fit:cover;display:block}
.count{position:absolute;right:12px;top:12px;background:rgba(10,20,28,.65);color:#fff;font-size:12px;padding:3px 9px;border-radius:999px;pointer-events:none}
.dots{display:flex;justify-content:center;gap:6px;padding:12px 0 0}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--blue)}
.body{padding:12px 20px 20px}
.body p{margin:0 0 10px;max-width:62ch}
.exif{color:var(--muted);font-size:13px}
.foot{padding:36px 0 0;color:var(--muted);font-size:14px}

dialog{border:0;padding:0;background:transparent;max-width:100vw;max-height:100vh;width:100vw;height:100vh}
dialog::backdrop{background:rgba(6,12,17,.92)}
.lb{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;padding:24px;gap:14px}
.lbimg{max-width:min(92vw,1100px);max-height:78vh;width:auto;background-size:cover;background-position:center;border-radius:3px}
.lbimg img{display:block;max-width:100%;max-height:78vh}
.lbcap{color:#D8E2E8;font-size:14px;text-align:center}
.lbbtn{all:unset;position:fixed;color:#fff;background:rgba(255,255,255,.14);width:44px;height:44px;border-radius:50%;display:grid;place-items:center;cursor:pointer;font-size:20px}
.lbbtn:hover{background:rgba(255,255,255,.28)}
.lbbtn:focus-visible{outline:2px solid #fff}
.x{top:calc(16px + env(safe-area-inset-top,0px));right:16px}.pv{left:12px;top:50%}.nx{right:12px;top:50%}

@media (max-width:820px){
  .shell{padding:32px 16px 64px}
  .feed{max-width:none}
  .head h2{font-size:26px}
}
.btn{display:inline-block;padding:9px 16px;border-radius:999px;border:1px solid var(--blue);background:var(--blue);color:var(--blue-ink);font:600 14px var(--sans);cursor:pointer;text-decoration:none}
.btn.ghost{background:transparent;color:var(--blue)}
.btn:disabled{opacity:.5;cursor:default}
#owner{margin-top:14px}
.hint{margin:8px 0 0;font-size:13px;color:var(--muted)}
#addlg,#ghdlg{width:min(520px,92vw);height:auto;max-height:90vh;overflow:auto;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:22px}
#addlg::backdrop,#ghdlg::backdrop{background:rgba(15,15,10,.55)}
#addlg h2,#ghdlg h2{font:400 28px/1.1 var(--serif);margin:0 0 16px}
.fld{display:block;margin:0 0 12px;font-size:14px}
.fld input,.fld textarea{display:block;width:100%;margin-top:4px;padding:9px 10px;border:1px solid var(--line);border-radius:4px;background:var(--paper);color:var(--ink);font:inherit}
.thumbs{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 12px}
.thumbs img{width:56px;height:56px;object-fit:cover;border-radius:3px}
.row{display:flex;gap:10px;margin-top:14px}
.body .del{margin-top:6px}
.views{display:flex;gap:4px;margin:0 auto 18px;padding:3px;border:1px solid var(--line);border-radius:999px;width:max-content}
.views a{padding:6px 14px;border-radius:999px;text-decoration:none;font-size:14px;font-weight:500}
.views a[aria-current=page]{background:var(--blue);color:var(--blue-ink)}
.gallery{columns:4 200px;column-gap:10px;width:100%}
.tile{display:block;position:relative;width:100%;margin:0 0 10px;padding:0;border:0;border-radius:6px;overflow:hidden;break-inside:avoid;cursor:zoom-in;background-color:var(--line);background-size:cover;background-position:center}
.tile img{display:block;width:100%;height:auto}
.tile .cap{position:absolute;left:0;right:0;bottom:0;padding:24px 10px 8px;color:#fff;font:500 13px/1.3 var(--sans);text-align:left;background:linear-gradient(transparent,rgba(10,10,5,.72));opacity:0;transition:opacity .15s}
.tile:hover .cap,.tile:focus-visible .cap{opacity:1}
@media (hover:none){.tile .cap{opacity:1}}
@media (max-width:820px){.gallery{columns:2 140px}}
.shell.gal .feed{display:none}
.shell:not(.gal) .galwrap{display:none}
.ownbar{display:flex;gap:18px;margin:0 20px 16px}
.edit{color:var(--blue)}
.th{padding:0;border:2px solid var(--blue);border-radius:4px;width:60px;height:60px;overflow:hidden;background-size:cover;background-position:center;cursor:pointer}
.th img{width:100%;height:100%;object-fit:cover;display:block;border-radius:0}
.th.off{opacity:.3;border-color:var(--line)}
.del{display:block;margin:0;padding:0;background:none;border:0;color:var(--muted);font:inherit;font-size:13px;cursor:pointer;text-decoration:underline}
.tagbar{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 16px}
.tagbar[hidden],.tile[hidden]{display:none}
.chip{padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:500 13px var(--sans);cursor:pointer}
.chip:hover{border-color:var(--blue)}
.chip[aria-pressed=true]{background:var(--blue);border-color:var(--blue);color:var(--blue-ink)}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 0}
.tags .chip{padding:3px 10px;font-size:12px}
.prows{display:flex;flex-direction:column;gap:8px;margin:0 0 12px}
.prow{display:flex;align-items:center;gap:10px}
.prow .th{flex:none}
.prow img{width:56px;height:56px;object-fit:cover;border-radius:3px}
.prow .th img{width:100%;height:100%;border-radius:0}
.prow input{flex:1;min-width:0;padding:7px 9px;border:1px solid var(--line);border-radius:4px;background:var(--paper);color:var(--ink);font:inherit;font-size:14px}
.rel{position:relative}
.arr{position:absolute;top:50%;transform:translateY(-50%);width:32px;height:32px;padding:0 0 3px;border:0;border-radius:50%;background:rgba(255,255,255,.85);color:#14232E;font:400 22px/1 var(--sans);display:grid;place-items:center;cursor:pointer;box-shadow:0 1px 4px rgba(0,0,0,.3)}
.arr:hover{background:#fff}
.arr.prev{left:10px}.arr.next{right:10px}
.arr[hidden]{display:none}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
</style>
</head>
<body>
<div class="shell">
  <aside class="side">
    <h1 class="mark" id="name">Your Name</h1>
    <p class="bio" id="bio">Photographer. Landscapes, streets and the occasional portrait. New shoots land here first.</p>
    <nav class="views" aria-label="Views"><a href="#feed" aria-current="page">Feed</a><a href="#gallery">Gallery</a></nav>
    <a class="contact" id="contact" href="mailto:hello@example.com">Get in touch</a>
    <div id="owner" hidden=""><button class="btn" id="addbtn" type="button">Add a shoot</button><p class="hint">Only you can see this.</p></div>
    
  </aside>
  <noscript><p class="hint" style="text-align:center;max-width:46ch;margin:0 auto">The photos are loaded by a script, and your viewer isn’t running it. This often happens in a file preview. Open the file in a full web browser, or upload it to a web host.</p></noscript>
  <main class="feed" id="feed"></main>
  <div class="galwrap" id="galwrap"><div class="tagbar" id="tagbar" role="group" aria-label="Filter by tag"></div><section class="gallery" id="gallery" aria-label="Gallery"></section></div>
</div>

<script type="application/json" id="data">{"shoots":[{"id":"blue-hour","title":"Blue hour at the harbour2","date":"2026-10-21","place":"Sample location","text":"Twenty minutes of usable light, and the tide did the rest. Shot handheld, braced against a bollard.","exif":"35mm · f/2.8 · 1/30s · ISO 800","ar":"4/5","frames":[{"g":"linear-gradient(180deg,#0f2a4a 0%,#2d5d8f 45%,#e9a86c 82%,#f4d3a1 100%)","tags":["dance"]},{"g":"linear-gradient(160deg,#10243a 0%,#1f4a73 55%,#c98a5a 100%)","tags":["dance"]},{"g":"radial-gradient(circle at 70% 30%,#f0c38e 0,#4f7ea8 35%,#0f2a4a 80%)","tags":["dance"]}]},{"id":"high-moor","title":"High moor, first frost","date":"2026-10-12","place":"Sample location","text":"Walked up before sunrise. The grass crunched, the sky stayed soft, and nobody else was out.","exif":"24mm · f/8 · 1/125s · ISO 100","ar":"3/2","frames":[{"g":"linear-gradient(180deg,#cfd9df 0%,#a7b9b2 50%,#6f8577 100%)","tags":["sport"]},{"g":"linear-gradient(200deg,#e4e9ea 0%,#9db0a9 60%,#566b5e 100%)","tags":["sport"]}]},{"id":"night-market","title":"Night market, 35mm","date":"2026-09-30","place":"Sample location","text":"One roll of colour film and a lot of walking. Scans are unedited apart from dust removal.","exif":"Film · 35mm · f/2 · 1/60s · ISO 400","ar":"4/5","frames":[{"g":"radial-gradient(circle at 25% 35%,#ff9a4d 0,#7a2d3a 40%,#1a1226 85%)"},{"g":"radial-gradient(circle at 75% 60%,#ffd36b 0,#b3473a 38%,#1a1226 85%)"},{"g":"linear-gradient(135deg,#2a1a3a,#c0563f 60%,#f2b05a)"},{"g":"radial-gradient(circle at 50% 20%,#6fd0c0 0,#2a5a6a 40%,#14101e 85%)"}]},{"id":"portraits","title":"Portraits for Maya","date":"2026-09-14","place":"Studio","text":"A short window light session. We kept it simple: one chair, one reflector, a lot of conversation.","exif":"85mm · f/1.8 · 1/200s · ISO 200","ar":"4/5","frames":[{"g":"linear-gradient(120deg,#d9c7b8 0%,#a98a76 55%,#5c4638 100%)"},{"g":"linear-gradient(200deg,#ece1d6 0%,#b79c88 60%,#6a5242 100%)"}]}]}</script>
<dialog id="addlg" aria-label="Add a shoot">
  <h2 id="ftitleh">Edit shoot</h2>
  <label class="fld">Photos<input id="fphotos" type="file" accept="image/*" multiple=""></label>
  <label class="fld">Tags for every photo <input id="ftags" type="text" placeholder="e.g. dance, portrait"></label><div class="prows" id="thumbs"></div>
  <label class="fld">Title<input id="ftitle" type="text"></label>
  <label class="fld">Date<input id="fdate" type="date"></label>
  <label class="fld">Location<input id="fplace" type="text"></label>
  <label class="fld">Caption<textarea id="ftext" rows="3"></textarea></label>
  <label class="fld">Camera settings<input id="fexif" type="text" placeholder="35mm · f/2.8 · 1/125s · ISO 200"></label>
  <p class="hint" id="fmsg" role="status"></p>
  <div class="row"><button class="btn" id="fgo" type="button" disabled="">Save changes</button><button class="btn ghost" id="fno" type="button">Cancel</button></div>
</dialog>

<dialog id="lb" aria-label="Photo viewer">
  <div class="lb">
    <div class="lbimg" id="lbimg"></div>
    <div class="lbcap" id="lbcap"></div>
  </div>
  <button class="lbbtn x" id="lbx" aria-label="Close">✕</button>
  <button class="lbbtn pv" id="lbp" aria-label="Previous photo">‹</button>
  <button class="lbbtn nx" id="lbn" aria-label="Next photo">›</button>
</dialog>

<script>
/* ===== EDIT HERE ===== */
const ME = {
  name: "Your Name",
  bio: "Photographer. Landscapes, streets and the occasional portrait. New shoots land here first.",
  email: "hello@example.com"
};

/* Each shoot is one post. Each frame is either a placeholder gradient (g) or a real photo (src).
   ar is the aspect ratio of the post, taken from its first frame. */
const DEFAULTS = [
  { id:"blue-hour", title:"Blue hour at the harbour", date:"2026-10-28", place:"Sample location",
    text:"Twenty minutes of usable light, and the tide did the rest. Shot handheld, braced against a bollard.",
    exif:"35mm · f/2.8 · 1/30s · ISO 800", ar:"4/5",
    frames:[
      {g:"linear-gradient(180deg,#0f2a4a 0%,#2d5d8f 45%,#e9a86c 82%,#f4d3a1 100%)"},
      {g:"linear-gradient(160deg,#10243a 0%,#1f4a73 55%,#c98a5a 100%)"},
      {g:"radial-gradient(circle at 70% 30%,#f0c38e 0,#4f7ea8 35%,#0f2a4a 80%)"}
    ]},
  { id:"high-moor", title:"High moor, first frost", date:"2026-10-12", place:"Sample location",
    text:"Walked up before sunrise. The grass crunched, the sky stayed soft, and nobody else was out.",
    exif:"24mm · f/8 · 1/125s · ISO 100", ar:"3/2",
    frames:[
      {g:"linear-gradient(180deg,#cfd9df 0%,#a7b9b2 50%,#6f8577 100%)"},
      {g:"linear-gradient(200deg,#e4e9ea 0%,#9db0a9 60%,#566b5e 100%)"}
    ]},
  { id:"night-market", title:"Night market, 35mm", date:"2026-09-30", place:"Sample location",
    text:"One roll of colour film and a lot of walking. Scans are unedited apart from dust removal.",
    exif:"Film · 35mm · f/2 · 1/60s · ISO 400", ar:"4/5",
    frames:[
      {g:"radial-gradient(circle at 25% 35%,#ff9a4d 0,#7a2d3a 40%,#1a1226 85%)"},
      {g:"radial-gradient(circle at 75% 60%,#ffd36b 0,#b3473a 38%,#1a1226 85%)"},
      {g:"linear-gradient(135deg,#2a1a3a,#c0563f 60%,#f2b05a)"},
      {g:"radial-gradient(circle at 50% 20%,#6fd0c0 0,#2a5a6a 40%,#14101e 85%)"}
    ]},
  { id:"portraits", title:"Portraits for Maya", date:"2026-09-14", place:"Studio",
    text:"A short window light session. We kept it simple: one chair, one reflector, a lot of conversation.",
    exif:"85mm · f/1.8 · 1/200s · ISO 200", ar:"4/5",
    frames:[
      {g:"linear-gradient(120deg,#d9c7b8 0%,#a98a76 55%,#5c4638 100%)"},
      {g:"linear-gradient(200deg,#ece1d6 0%,#b79c88 60%,#6a5242 100%)"}
    ]}
];
let SHOOTS = DEFAULTS;
try { const raw = document.getElementById('data').textContent.trim(); if (raw) SHOOTS = JSON.parse(raw).shoots; } catch (e) {}
/* ===================== */

const $ = id => document.getElementById(id);
const fmt = d => new Date(d+"T12:00:00").toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"});

$("name").textContent = ME.name;
$("bio").textContent = ME.bio;
$("contact").href = "mailto:" + ME.email;
document.title = ME.name + " — Photography";

const flat = []; // for the lightbox: {post, frame, i, n}
const feed = $("feed");

SHOOTS.slice().sort((a,b)=>b.date.localeCompare(a.date)).forEach(s=>{
  const post = document.createElement("article");
  post.className = "post"; post.id = "s-" + s.id;

  const head = document.createElement("div"); head.className = "head";
  head.innerHTML = '<h2></h2><p class="sub"></p>';
  head.querySelector("h2").textContent = s.title;
  head.querySelector(".sub").textContent = fmt(s.date) + (s.place ? " · " + s.place : "");
  post.appendChild(head);

  const reel = document.createElement("div"); reel.className = "reel";
  reel.setAttribute("role","group"); reel.setAttribute("aria-label", s.title + " photos");
  const dots = document.createElement("div"); dots.className = "dots";

  s.frames.forEach((f,i)=>{
    const b = document.createElement("button");
    b.className = "frame"; b.type = "button"; b.style.aspectRatio = s.ar;
    b.setAttribute("aria-label", "Open photo " + (i+1) + " of " + s.frames.length + ", " + s.title);
    if (f.src) { const im = document.createElement("img"); im.src = f.src; im.alt = f.alt || s.title; b.appendChild(im); }
    else b.style.backgroundImage = f.g;
    if (s.frames.length > 1) { const c = document.createElement("span"); c.className = "count"; c.textContent = (i+1) + "/" + s.frames.length; b.appendChild(c); }
    const idx = flat.length; flat.push({s, f, i});
    b.addEventListener("click", ()=>openLb(idx));
    reel.appendChild(b);
    const d = document.createElement("i"); if (!i) d.className = "on"; dots.appendChild(d);
  });
  const rel = document.createElement("div"); rel.className = "rel"; rel.appendChild(reel); post.appendChild(rel);
  if (s.frames.length > 1) {
    [["‹", -1, "prev"], ["›", 1, "next"]].forEach(([ch, d, cls]) => {
      const a = document.createElement("button"); a.type = "button"; a.className = "arr " + cls; a.textContent = ch;
      a.setAttribute("aria-label", d < 0 ? "Previous photo" : "Next photo"); if (d < 0) a.hidden = true;
      a.onclick = () => reel.scrollBy({ left: d * reel.clientWidth, behavior: "smooth" }); rel.appendChild(a);
    });
  }
  if (s.frames.length > 1) {
    post.appendChild(dots);
    reel.addEventListener("scroll", ()=>{
      const k = Math.round(reel.scrollLeft / reel.clientWidth);
      [...dots.children].forEach((d,j)=>d.classList.toggle("on", j === k)); rel.querySelector(".prev").hidden = k === 0; rel.querySelector(".next").hidden = k === s.frames.length - 1;
    }, {passive:true});
  }

  const body = document.createElement("div"); body.className = "body";
  body.innerHTML = '<p></p><div class="exif"></div>';
  body.querySelector("p").textContent = s.text;
  body.querySelector(".exif").textContent = s.exif;
  const tg = [...new Set(s.frames.flatMap(f => f.tags || []))];
  if (tg.length) { const w = document.createElement("div"); w.className = "tags"; tg.forEach(t => { const b = document.createElement("button"); b.type = "button"; b.className = "chip"; b.textContent = "#" + t; b.onclick = () => openGallery(t); w.appendChild(b); }); body.appendChild(w); }
  post.appendChild(body);
  feed.appendChild(post);

});

const end = document.createElement("p"); end.className = "foot";
end.textContent = "That’s everything so far. New shoots appear at the top.";
feed.appendChild(end);

/* Search and sharing metadata */
(() => {
  const desc = ME.bio, set = (id, v) => { const e = $(id); if (e) e.setAttribute('content', v); };
  set('m-desc', desc); set('m-ogd', desc); set('m-ogt', ME.name + ' — Photography');
  const ld = document.createElement('script'); ld.type = 'application/ld+json';
  ld.textContent = JSON.stringify({ '@context': 'https://schema.org', '@type': 'CollectionPage', name: ME.name + ' — Photography', description: desc, author: { '@type': 'Person', name: ME.name }, hasPart: SHOOTS.map(s => ({ '@type': 'CreativeWork', name: s.title, dateCreated: s.date, description: s.text, locationCreated: s.place ? { '@type': 'Place', name: s.place } : undefined })) }).replace(/</g, String.fromCharCode(92) + 'u003c');
  document.head.appendChild(ld);
})();

addEventListener('hashchange', () => { if (location.hash === '#admin' && !window.claude) location.reload(); });

/* Owner tools: only the page owner sees these */
(async () => {
  let art = null;
  try { if (window.claude) { const u = await claude.use('user'); if (u && u.canEdit()) art = await claude.use('artifact'); } } catch (e) {}
  if (!art && !window.claude && location.hash === '#admin') {
    const cfg = () => { try { return JSON.parse(localStorage.getItem('pf-gh') || 'null'); } catch (e) { return null; } };
    const hint = $('owner').querySelector('.hint');
    const updateHint = () => { const c = cfg(); hint.textContent = c && c.token && c.repo ? 'Changes publish straight to GitHub.' : 'Changes download as a new index.html. Upload it to your host to publish.'; };
    async function ghPublish(c, html) {
      const api = 'https://api.github.com/repos/' + c.repo + '/contents/' + (c.path || 'index.html');
      const H = { Authorization: 'Bearer ' + c.token, Accept: 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28' };
      let sha; const r = await fetch(api + '?ref=' + encodeURIComponent(c.branch || 'main'), { headers: H });
      if (r.ok) sha = (await r.json()).sha;
      else if (r.status !== 404) throw new Error('GitHub replied ' + r.status + '. Check the repository, branch and token in Auto-publish settings.');
      const bytes = new TextEncoder().encode(html); let bin = '';
      for (let i = 0; i < bytes.length; i += 32768) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 32768));
      const put = await fetch(api, { method: 'PUT', headers: { ...H, 'Content-Type': 'application/json' }, body: JSON.stringify({ message: 'Update photography site', content: btoa(bin), sha, branch: c.branch || 'main' }) });
      if (!put.ok) throw new Error('GitHub could not save the update (' + put.status + '). The token needs read and write access to Contents on this repository.');
    }
    art = { publish: async html => {
      const c = cfg();
      if (c && c.token && c.repo) { await ghPublish(c, html); $('fmsg').textContent = 'Published. Your site updates within a minute or two.'; }
      else { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([html], { type: 'text/html' })); a.download = 'index.html'; document.body.appendChild(a); a.click(); a.remove(); }
      setTimeout(() => { location.replace(URL.createObjectURL(new Blob([html], { type: 'text/html' })) + '#admin'); }, 1200);
    } };
    const link = document.createElement('button'); link.type = 'button'; link.className = 'del'; link.id = 'ghlink'; link.textContent = 'Auto-publish settings';
    $('owner').appendChild(link);
    const gd = document.createElement('dialog'); gd.id = 'ghdlg'; gd.setAttribute('aria-label', 'Auto-publish settings');
    gd.innerHTML = '<h2>Auto-publish</h2><p class="hint">Publishes straight to a GitHub repository, so your site updates without downloading a file. The token stays in this browser only.</p><label class="fld">Repository<input id="ghrepo" type="text" placeholder="username/my-photos"></label><label class="fld">Branch<input id="ghbranch" type="text" placeholder="main"></label><label class="fld">File<input id="ghpath" type="text" placeholder="index.html"></label><label class="fld">Access token<input id="ghtoken" type="password" autocomplete="off"></label><div class="row"><button class="btn" id="ghsave" type="button">Save</button><button class="btn ghost" id="ghclear" type="button">Clear</button><button class="btn ghost" id="ghclose" type="button">Close</button></div>';
    document.body.appendChild(gd);
    link.onclick = () => { const c = cfg() || {}; $('ghrepo').value = c.repo || ''; $('ghbranch').value = c.branch || 'main'; $('ghpath').value = c.path || 'index.html'; $('ghtoken').value = c.token || ''; gd.showModal(); };
    $('ghsave').onclick = () => { try { localStorage.setItem('pf-gh', JSON.stringify({ repo: $('ghrepo').value.trim(), branch: $('ghbranch').value.trim() || 'main', path: $('ghpath').value.trim() || 'index.html', token: $('ghtoken').value.trim() })); } catch (e) {} gd.close(); updateHint(); };
    $('ghclear').onclick = () => { try { localStorage.removeItem('pf-gh'); } catch (e) {} gd.close(); updateHint(); };
    $('ghclose').onclick = () => gd.close();
    updateHint();
  }
  if (!art) return;
  $('owner').hidden = false;
  const dlg = $('addlg'), msg = t => { $('fmsg').textContent = t; };
  const today = () => new Date().toISOString().slice(0, 10);
  let editing = null, keep = [];
  async function save(list) {
    const c = document.documentElement.cloneNode(true);
    ['feed','gallery','tagbar','lbimg','lbcap','thumbs','fmsg'].forEach(id => { c.querySelector('#' + id).innerHTML = ''; });
    c.querySelector('.shell').classList.remove('gal');
    ['ghdlg','ghlink'].forEach(id => { const e = c.querySelector('#' + id); if (e) e.remove(); });
    c.querySelectorAll('dialog').forEach(d => d.removeAttribute('open'));
    c.querySelectorAll('head script').forEach(e => { if (e.type === 'application/ld+json') e.remove(); });
    c.querySelector('#owner').setAttribute('hidden', '');
    const bs = String.fromCharCode(92);
    c.querySelector('#data').textContent = JSON.stringify({ shoots: list }).replace(/</g, bs + 'u003c');
    const html = '<!DOCTYPE html>' + String.fromCharCode(10) + c.outerHTML;
    if (window.claude && html.length > 15.5e6) throw new Error('That is too many photos for one page. Delete an older shoot first.');
    await art.publish(html);
  }
  const norm = v => [...new Set(String(v).split(',').map(t => t.trim().toLowerCase().replace(/^#+/, '').slice(0, 24)).filter(Boolean))];
  if (!$('ftags')) { const l = document.createElement('label'); l.className = 'fld'; l.innerHTML = 'Tags for every photo <input id="ftags" type="text" placeholder="e.g. dance, portrait">'; $('thumbs').before(l); }
  $('thumbs').className = 'prows';
  let rows = [];
  function drawRows() {
    const t = $('thumbs'); t.innerHTML = '';
    rows.forEach((r, i) => {
      const d = document.createElement('div'); d.className = 'prow';
      const th = document.createElement(r.frame ? 'button' : 'span'); th.className = 'th' + (r.off ? ' off' : '');
      const src = r.frame ? r.frame.src : r.url;
      if (src) { const im = document.createElement('img'); im.src = src; im.alt = ''; th.appendChild(im); } else th.style.backgroundImage = r.frame.g;
      if (r.frame) { th.type = 'button'; th.title = r.off ? 'Click to keep this photo' : 'Click to remove this photo'; th.onclick = () => { r.off = !r.off; drawRows(); }; }
      const inp = document.createElement('input'); inp.type = 'text'; inp.placeholder = 'Tags for this photo'; inp.value = r.tags;
      inp.setAttribute('aria-label', 'Tags for photo ' + (i + 1)); inp.oninput = () => { r.tags = inp.value; };
      d.append(th, inp); t.appendChild(d);
    });
  }
  function openDlg(s) {
    editing = s || null; rows = s ? s.frames.map(f => ({ frame: f, tags: (f.tags || []).join(', '), off: false })) : [];
    $('fphotos').value = ''; $('ftags').value = ''; $('ftitle').value = s ? s.title : ''; $('fdate').value = s ? s.date : today();
    $('fplace').value = s && s.place ? s.place : ''; $('ftext').value = s && s.text ? s.text : ''; $('fexif').value = s && s.exif ? s.exif : '';
    $('ftitleh').textContent = s ? 'Edit shoot' : 'Add a shoot'; $('fgo').textContent = s ? 'Save changes' : 'Publish shoot';
    msg(s ? 'Click a photo to remove it. Choose files to add more.' : ''); $('fgo').disabled = false; drawRows(); dlg.showModal();
  }
  $('addbtn').onclick = () => openDlg(null);
  $('fno').onclick = () => dlg.close();
  $('fphotos').onchange = () => { [...$('fphotos').files].forEach(f => rows.push({ file: f, url: URL.createObjectURL(f), tags: '' })); $('fphotos').value = ''; drawRows(); };
  $('fgo').onclick = async () => {
    const title = $('ftitle').value.trim(), all = norm($('ftags').value), live = rows.filter(r => !r.off);
    if (!title || !live.length) { msg('Add a title and keep at least one photo.'); return; }
    $('fgo').disabled = true; msg('Preparing photos…');
    try {
      const frames = []; let ar = editing ? editing.ar : '4/5';
      for (const r of live) {
        const tags = norm(r.tags + ',' + all.join(','));
        if (r.frame) { frames.push({ ...r.frame, tags }); continue; }
        const bmp = await createImageBitmap(r.file), k = Math.min(1, 1600 / Math.max(bmp.width, bmp.height));
        const w = Math.round(bmp.width * k), h = Math.round(bmp.height * k), cv = document.createElement('canvas');
        cv.width = w; cv.height = h; cv.getContext('2d').drawImage(bmp, 0, 0, w, h);
        if (!frames.length) ar = Math.min(1.91, Math.max(0.8, w / h)).toFixed(3);
        frames.push({ src: cv.toDataURL('image/jpeg', 0.82), alt: title, tags });
      }
      const data = { id: editing ? editing.id : 'u' + Date.now().toString(36), title, date: $('fdate').value || today(), place: $('fplace').value.trim(), text: $('ftext').value.trim(), exif: $('fexif').value.trim(), ar, frames };
      msg('Publishing…');
      await save(editing ? SHOOTS.map(x => x.id === editing.id ? data : x) : [data, ...SHOOTS]);
    } catch (e) { msg(e && e.message ? e.message : 'Could not publish. Use JPEG, PNG or WebP photos.'); $('fgo').disabled = false; }
  };
  document.querySelectorAll('.post').forEach(p => {
    const s = SHOOTS.find(x => 's-' + x.id === p.id); if (!s) return;
    const bar = document.createElement('div'); bar.className = 'ownbar';
    const eb = document.createElement('button'); eb.type = 'button'; eb.className = 'del edit'; eb.textContent = 'Edit this shoot';
    eb.onclick = () => openDlg(s);
    const b = document.createElement('button'); b.type = 'button'; b.className = 'del'; b.textContent = 'Delete this shoot';
    let armed = false;
    b.onclick = async () => {
      if (!armed) { armed = true; b.textContent = 'Click again to delete'; setTimeout(() => { armed = false; b.textContent = 'Delete this shoot'; }, 3000); return; }
      try { await save(SHOOTS.filter(x => x.id !== s.id)); } catch (e) { b.textContent = e.message || 'Could not delete'; }
    };
    bar.append(eb, b); p.appendChild(bar);
  });
})();

/* Gallery view: every photo from every shoot, as a masonry wall */
const gal = $('gallery'), shell = document.querySelector('.shell'), RATIOS = ['4/5', '1/1', '3/4', '3/2', '2/3'], tiles = [], bar = $('tagbar'); let GF = '';
flat.forEach(({ s, f, i }, idx) => {
  const t = document.createElement('button'); t.type = 'button'; t.className = 'tile';
  t.setAttribute('aria-label', 'Open ' + s.title + ', photo ' + (i + 1));
  if (f.src) { const im = document.createElement('img'); im.src = f.src; im.alt = f.alt || s.title; im.loading = 'lazy'; t.appendChild(im); }
  else { t.style.backgroundImage = f.g; t.style.aspectRatio = RATIOS[idx % RATIOS.length]; }
  const c = document.createElement('span'); c.className = 'cap'; c.textContent = s.title; t.appendChild(c);
  t.onclick = () => openLb(idx); t.dataset.tags = '|' + (f.tags || []).join('|') + '|'; tiles.push(t);
  gal.appendChild(t);
});
function route() {
  const g = location.hash === '#gallery';
  shell.classList.toggle('gal', g);
  document.querySelectorAll('.views a').forEach(a => { if ((a.getAttribute('href') === '#gallery') === g) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current'); });
}
const counts = {};
flat.forEach(({ f }) => (f.tags || []).forEach(t => { counts[t] = (counts[t] || 0) + 1; }));
const names = Object.keys(counts).sort();
function applyFilter() {
  tiles.forEach(t => { t.hidden = !!GF && !t.dataset.tags.includes('|' + GF + '|'); });
  bar.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', String((b.dataset.tag || '') === GF)));
}
function openGallery(tag) { GF = tag || ''; applyFilter(); if (location.hash === '#gallery') window.scrollTo(0, 0); else location.hash = 'gallery'; }
bar.hidden = !names.length;
[''].concat(names).forEach(n => {
  if (!names.length) return;
  const b = document.createElement('button'); b.type = 'button'; b.className = 'chip'; b.dataset.tag = n;
  b.textContent = n ? n + ' (' + counts[n] + ')' : 'All'; b.onclick = () => openGallery(n); bar.appendChild(b);
});
applyFilter();
route();
addEventListener('hashchange', () => { route(); window.scrollTo(0, 0); });

/* Lightbox */
const lb = $("lb"); let cur = 0;
function show(){
  const {s,f,i} = flat[cur], box = $("lbimg");
  box.innerHTML = ""; box.style.backgroundImage = "";
  if (f.src) { const im = document.createElement("img"); im.src = f.src; im.alt = f.alt || s.title; box.style.aspectRatio = ""; box.style.height = ""; box.style.maxWidth = ""; box.appendChild(im); }
  else { box.style.backgroundImage = f.g; box.style.aspectRatio = s.ar; box.style.height = "78vh"; box.style.maxWidth = "92vw"; }
  $("lbcap").textContent = s.title + " · " + (i+1) + "/" + s.frames.length + " · " + s.exif + (f.tags && f.tags.length ? " · " + f.tags.map(t => "#" + t).join(" ") : "");
}
function openLb(i){ cur = i; show(); if (!lb.open) lb.showModal(); }
function step(d){ const ok = i => !shell.classList.contains("gal") || !tiles[i].hidden; let n = 0; do { cur = (cur + d + flat.length) % flat.length; n++; } while (!ok(cur) && n <= flat.length); show(); }
$("lbx").onclick = ()=>lb.close();
$("lbp").onclick = ()=>step(-1);
$("lbn").onclick = ()=>step(1);
lb.addEventListener("click", e=>{ if (e.target === lb) lb.close(); });
document.addEventListener("keydown", e=>{
  if (!lb.open) return;
  if (e.key === "ArrowLeft") step(-1);
  if (e.key === "ArrowRight") step(1);
});
</script>
